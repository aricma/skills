name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        # mise.toml is the single source of truth for tool versions.
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c

      - name: Check formatting
        run: dprint check

      - name: Check skills
        run: ./scripts/check-skills.sh .

      - name: Test the skill checker
        run: ./scripts/check-skills.sh --self-test
